- name: install kubectl
  hosts: localhost
  user: ubuntu
  become: yes
  vars:
    myPath: /home/ubuntu/

  tasks:
    - name: 1. Update Package Manager
      apt:
        update_cache: yes

    - name: 2. Install Kubectl packages
      apt:
        name={{ item }}
      with_items:
        - apt-transport-https
        - ca-certificates
        - curl
        - gpg

    - name: 3. Create keyrings directory
      shell:
        cmd: mkdir -p -m 755 /etc/apt/keyrings

    - name: 4. Get APT Key
      shell:
        cmd: curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.31/deb/Release.key | sudo gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg

    - name: 5. Echo
      shell:
        cmd: echo 'deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.31/deb/ /' | sudo tee -a /etc/apt/sources.list.d/kubernetes.list

    - name: 6. Update Package Manager
      apt:
        update_cache: yes

    - name: 7. Install Kubectl
      shell:
        cmd: sudo snap install kubectl --classic
