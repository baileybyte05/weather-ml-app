name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: weather-ml-minikube
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on:
      - self-hosted
      - linux
      - minikube

    steps:
      - name: Check out successful build revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Install Minikube
        run: |
          set -e

          if ! command -v minikube >/dev/null 2>&1; then
            curl -LO https://storage.googleapis.com/minikube/releases/latest/minikube-linux-amd64
            sudo install minikube-linux-amd64 /usr/local/bin/minikube
            rm minikube-linux-amd64
          fi

          minikube version
          docker version

      - name: Start Minikube
        run: |
          set -e

          if minikube status --profile minikube >/dev/null 2>&1; then
            echo "Using the existing Minikube cluster"
          else
            echo "Starting Minikube"
            minikube delete --profile minikube --all >/dev/null 2>&1 || true
            minikube start --profile minikube --driver=docker
          fi

          minikube update-context --profile minikube
          mkdir -p "$HOME/.kube"
          minikube kubectl -- \
            --kubeconfig="$HOME/.kube/config" config use-context minikube

      - name: Configure and verify Kubernetes access
        run: |
          set -e

          kubectl config use-context minikube
          kubectl cluster-info
          kubectl get nodes
          kubectl get namespaces

      - name: Apply Kubernetes deployment and service
        run: |
          set -e
          kubectl apply \
            -f k8s/deployment.yaml \
            -f k8s/service.yaml

      - name: Roll out the tested image
        env:
          IMAGE: baileybyte05/weather-ml-app:${{ github.event.workflow_run.head_sha }}
        run: |
          set -e

          kubectl set image deployment/weather-ml-app \
            weather-ml-app="$IMAGE"

          kubectl rollout status \
            deployment/weather-ml-app \
            --timeout=180s
