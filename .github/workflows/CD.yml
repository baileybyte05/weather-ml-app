name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weather-ml-minikube
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on:
      - self-hosted
      - linux
      - minikube

    steps:
      - name: Check out successful build revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Configure Kubernetes access
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          set -e

          mkdir -p "$HOME/.kube"

          if [ -n "$KUBE_CONFIG" ]; then
            printf '%s' "$KUBE_CONFIG" > "$HOME/.kube/config"
            chmod 600 "$HOME/.kube/config"
          elif [ -f "$HOME/.kube/config" ]; then
            echo "Using the existing Minikube kubeconfig"
            chmod 600 "$HOME/.kube/config"
          else
            echo "No kubeconfig found and KUBE_CONFIG is not set" >&2
            exit 1
          fi

          kubectl config use-context minikube
          kubectl cluster-info
          kubectl get nodes

      - name: Apply Kubernetes deployment and service
        run: |
          set -e
          kubectl apply -f k8s/deployment.yaml -f k8s/service.yaml
          kubectl rollout status deployment/weather-ml-app --timeout=180s

      - name: Roll out the tested image
        env:
          IMAGE: baileybyte05/weather-ml-app:${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -e
          kubectl set image deployment/weather-ml-app \
            weather-ml-app="$IMAGE"
          kubectl rollout status deployment/weather-ml-app --timeout=180s
